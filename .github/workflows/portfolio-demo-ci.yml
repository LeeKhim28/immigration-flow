name: Portfolio Demo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: immigration_flow_test
          POSTGRES_USER: immigration_flow
          POSTGRES_PASSWORD: immigration_flow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U immigration_flow -d immigration_flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://immigration_flow:immigration_flow_test@localhost:5432/immigration_flow_test
      TEST_DATABASE_URL: postgresql+psycopg://immigration_flow:immigration_flow_test@localhost:5432/immigration_flow_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.14
      - run: uv sync --project backend --locked --all-groups
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run --project backend ruff check backend/app backend/tests
      - run: uv run --project backend mypy backend/app
      - run: uv run --project backend pytest backend/tests -q
      - run: ruby scripts/validate_knowledge_base.rb

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/immigration-flow-web/package-lock.json
      - run: npm ci
        working-directory: apps/immigration-flow-web
      - run: npm run lint
        working-directory: apps/immigration-flow-web
      - run: npm run typecheck
        working-directory: apps/immigration-flow-web
      - run: npm test -- --run
        working-directory: apps/immigration-flow-web
      - run: npm run build
        working-directory: apps/immigration-flow-web

  browser-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/immigration-flow-web/package-lock.json
      - run: uv python install 3.14
      - run: uv sync --project backend --locked --all-groups
      - run: npm ci
        working-directory: apps/immigration-flow-web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/immigration-flow-web
      - run: npm run e2e
        working-directory: apps/immigration-flow-web
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: apps/immigration-flow-web/test-results/
          retention-days: 7
          if-no-files-found: ignore
