[project]
name = "immigration-flow-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.136,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
